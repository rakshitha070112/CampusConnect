<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Register - CampusConnect</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-body"><div class="auth-container"><div class="auth-box register-box"><h1>CampusConnect</h1><p class="subtitle">Create Student Account</p><form id="registerForm"><div class="form-grid"><div><label>Full Name</label><input id="regName" required></div><div><label>Roll Number</label><input id="regRoll" required></div><div><label>Email</label><input type="email" id="regEmail" required></div><div><label>Password</label><input type="password" id="regPassword" required></div><div><label>College</label><input id="regCollege" required></div><div><label>Branch</label><select id="regBranch" required><option value="">Select branch</option><option>CSE</option><option>ECE</option><option>EEE</option><option>IT</option><option>MECH</option><option>CIVIL</option></select></div><div><label>Year</label><select id="regYear" required><option value="">Select year</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select></div><div><label>Skills</label><input id="regSkills" placeholder="Python, Java, HTML"></div></div><button type="submit" class="btn full-btn">Create Account</button></form><p id="registerMessage" class="message"></p><p class="switch-text">Already have an account? <a href="login.html">Login</a></p><a href="index.html" class="back-link">← Back to Home</a></div></div><script src="js/app.js"></script></body></html>
