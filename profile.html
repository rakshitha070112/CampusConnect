<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Profile - CampusConnect</title><link rel="stylesheet" href="css/style.css"></head><body class="app-body"><nav class="navbar dashboard-nav"><div class="logo">CampusConnect</div><div class="nav-menu"><a href="dashboard.html">Dashboard</a><a href="projects.html">Projects</a><a href="students.html">Students</a><a href="profile.html" class="active">Profile</a><button onclick="logout()" class="logout-btn">Logout</button></div></nav><main class="main-content"><div class="page-heading"><div><p class="tag">MY PROFILE</p><h1>Student Profile</h1><p>Update your information and technical skills.</p></div></div><div class="profile-layout"><div class="profile-card"><div class="avatar" id="profileAvatar">R</div><h2 id="profileNameCard">Student</h2><p id="profileBranchCard">CSE</p><p id="profileCollegeCard">College</p></div><div class="form-card"><form id="profileForm"><div class="form-grid"><div><label>Full Name</label><input id="profileName" required></div><div><label>Roll Number</label><input id="profileRoll" required></div><div><label>Email</label><input type="email" id="profileEmail" required></div><div><label>College</label><input id="profileCollege" required></div><div><label>Branch</label><select id="profileBranch"><option>CSE</option><option>ECE</option><option>EEE</option><option>IT</option><option>MECH</option><option>CIVIL</option></select></div><div><label>Year</label><select id="profileYear"><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select></div></div><label>Skills</label><input id="profileSkills" placeholder="Python, Java, HTML, CSS"><label>About Me</label><textarea id="profileAbout" placeholder="Write something about yourself..."></textarea><button type="submit" class="btn">Save Changes</button></form><p id="profileMessage" class="message"></p></div></div></main><script src="
