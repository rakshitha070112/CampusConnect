<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Projects - CampusConnect</title><link rel="stylesheet" href="css/style.css"></head><body class="app-body"><nav class="navbar dashboard-nav"><div class="logo">CampusConnect</div><div class="nav-menu"><a href="dashboard.html">Dashboard</a><a href="projects.html" class="active">Projects</a><a href="students.html">Students</a><a href="profile.html">Profile</a><button onclick="logout()" class="logout-btn">Logout</button></div></nav><main class="main-content"><div class="page-heading"><div><p class="tag">PROJECT HUB</p><h1>Projects</h1><p>Create a project or find a project to join.</p></div><button onclick="openProjectForm()" class="btn">+ Create Project</button></div><div class="search-box"><input id="projectSearch" placeholder="Search projects by name, category or skill..." oninput="renderProjects()"></div><div id="projectMessage" class="message"></div><div id="projectList" class="project-grid"></div></main><div id="projectModal" class="modal hidden"><div class="modal-box"><button class="close-btn" onclick="closeProjectForm()">×</button><h2>Create New Project</h2><form id="projectForm"><label>Project Name</label><input id="projectName" required><label>Description</label><textarea id="projectDescription" required></textarea><label>Category</label><select id="projectCategory" required><option value="">Select category</option><option>Web Development</option><option>Artificial Intelligence</option><option>Machine Learning</option><option>Cyber Security</option><option>Data Science</option><option>IoT</option><option>Mobile Application</option></select><label>Required Skills</label><input id="projectSkills" placeholder="Java, HTML, MongoDB" required><label>Team Size</label><input type="number" id="projectTeamSize" min="1" max="20" value="4" required><button type="submit" class="btn full-btn">Create Project</button></form></div></div><script src="js/app.js"></script></body></html>
